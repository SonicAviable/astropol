<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: Play; font-weight: 700; src: url(../../Assets/Resources/Fonts/Play-Bold.ttf); }
@font-face { font-family: Play; src: url(../../Assets/Resources/Fonts/Play-Regular.ttf); }
body { margin: 0; }
#cover { width: 1600px; height: 900px; background: #050B16; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; font-family: Play; color: #E6F1F4; }
.v { position: relative; display: flex; align-items: center; gap: 28px; padding: 0 70px; border: 1px solid rgba(102,219,209,0.15); }
.n { position: absolute; left: 24px; top: 18px; font-size: 40px; font-weight: 700; color: #F2C766; }
.t b { display: block; font-weight: 700; font-size: 28px; letter-spacing: 9px; } .t i { font-style: normal; font-size: 18px; letter-spacing: 4px; color: #93AEBA; }
</style></head><body><div id="cover">
<!-- 1: два флага-прямоугольника с тонкой золотой окантовкой, глянец -->
<div class="v"><div class="n">1</div>
<svg width="220" height="74" viewBox="0 0 220 74"><defs><linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.25"/></linearGradient>
<g id="kz"><rect width="104" height="70" fill="#00AFCA"/><circle cx="56" cy="30" r="11" fill="#FEC50C"/><g stroke="#FEC50C" stroke-width="2"><line x1="56" y1="12" x2="56" y2="16"/><line x1="56" y1="44" x2="56" y2="48"/><line x1="38" y1="30" x2="42" y2="30"/><line x1="70" y1="30" x2="74" y2="30"/><line x1="43" y1="17" x2="46" y2="20"/><line x1="66" y1="40" x2="69" y2="43"/><line x1="43" y1="43" x2="46" y2="40"/><line x1="66" y1="20" x2="69" y2="17"/></g><path d="M36 52 q20 -9 40 0 q-20 4 -40 0z" fill="#FEC50C"/><rect x="7" y="5" width="5" height="60" fill="#FEC50C"/></g>
<g id="ru"><rect width="104" height="70" fill="#fff"/><rect y="23.3" width="104" height="23.4" fill="#0039A6"/><rect y="46.7" width="104" height="23.3" fill="#D52B1E"/></g></defs>
<g transform="translate(2 2)"><use href="#ru"/><rect width="104" height="70" fill="url(#gl)"/><rect width="104" height="70" fill="none" stroke="#F2C766" stroke-width="2"/></g>
<g transform="translate(114 2)"><use href="#kz"/><rect width="104" height="70" fill="url(#gl)"/><rect width="104" height="70" fill="none" stroke="#F2C766" stroke-width="2"/></g></svg>
<div class="t"><b>СТУДИЯ SMARTBIZ</b><i>РОССИЯ · КАЗАХСТАН</i></div></div>
<!-- 2: один флаг, разрезанный по диагонали -->
<div class="v"><div class="n">2</div>
<svg width="150" height="100" viewBox="0 0 150 100"><defs><clipPath id="a"><polygon points="0,0 150,0 0,100"/></clipPath><clipPath id="b"><polygon points="150,0 150,100 0,100"/></clipPath>
<linearGradient id="gl2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.3"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.25"/></linearGradient></defs>
<g clip-path="url(#a)"><rect width="150" height="33.3" fill="#fff"/><rect y="33.3" width="150" height="33.4" fill="#0039A6"/><rect y="66.7" width="150" height="33.3" fill="#D52B1E"/></g>
<g clip-path="url(#b)"><rect width="150" height="100" fill="#00AFCA"/><circle cx="104" cy="62" r="13" fill="#FEC50C"/><path d="M80 86 q24 -10 48 0 q-24 4 -48 0z" fill="#FEC50C"/></g>
<line x1="150" y1="0" x2="0" y2="100" stroke="#F2C766" stroke-width="3"/>
<rect width="150" height="100" fill="url(#gl2)"/><rect x="1" y="1" width="148" height="98" fill="none" stroke="#F2C766" stroke-width="2"/></svg>
<div class="t"><b>СТУДИЯ SMARTBIZ</b><i>РОССИЯ · КАЗАХСТАН</i></div></div>
<!-- 3: круглые значки-медали -->
<div class="v"><div class="n">3</div>
<svg width="190" height="96" viewBox="0 0 190 96"><defs><clipPath id="r1"><circle cx="46" cy="48" r="40"/></clipPath><clipPath id="r2"><circle cx="140" cy="48" r="40"/></clipPath>
<radialGradient id="sh" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="0.6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.35"/></radialGradient></defs>
<g clip-path="url(#r1)"><rect x="6" y="8" width="80" height="27" fill="#fff"/><rect x="6" y="35" width="80" height="27" fill="#0039A6"/><rect x="6" y="62" width="80" height="27" fill="#D52B1E"/></g>
<g clip-path="url(#r2)"><rect x="100" y="8" width="80" height="80" fill="#00AFCA"/><circle cx="140" cy="42" r="13" fill="#FEC50C"/><path d="M118 66 q22 -9 44 0 q-22 4 -44 0z" fill="#FEC50C"/></g>
<circle cx="46" cy="48" r="40" fill="url(#sh)"/><circle cx="140" cy="48" r="40" fill="url(#sh)"/>
<circle cx="46" cy="48" r="41" fill="none" stroke="#F2C766" stroke-width="3"/><circle cx="140" cy="48" r="41" fill="none" stroke="#F2C766" stroke-width="3"/></svg>
<div class="t"><b>СТУДИЯ SMARTBIZ</b><i>РОССИЯ · КАЗАХСТАН</i></div></div>
<!-- 4: тонкая лента из двух флагов под надписью -->
<div class="v" style="flex-direction:column;align-items:flex-start;justify-content:center"><div class="n">4</div>
<div class="t"><b>СТУДИЯ SMARTBIZ</b></div>
<svg width="420" height="16" viewBox="0 0 420 16"><rect width="70" height="16" fill="#fff"/><rect x="70" width="70" height="16" fill="#0039A6"/><rect x="140" width="70" height="16" fill="#D52B1E"/><rect x="210" width="210" height="16" fill="#00AFCA"/><circle cx="315" cy="8" r="5" fill="#FEC50C"/><rect x="216" y="2" width="3" height="12" fill="#FEC50C"/></svg>
<div class="t"><i>РОССИЯ · КАЗАХСТАН</i></div></div>
</div></body></html>
