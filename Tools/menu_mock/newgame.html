    for (let k = 1; k <= 2; k++) if (d[k][1] < (R * 0.09) ** 2) { g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(P[d[k][0]][0], P[d[k][0]][1]); g.stroke(); } });
  const cols = ['#FFE7A8', '#9FD8FF', '#FFFFFF', '#FFB880', '#C8B8FF'];
  P.forEach(p => { g.fillStyle = cols[Math.floor(r() * cols.length)]; g.beginPath(); g.arc(p[0], p[1], 1.4 + r() * 1.4, 0, 7); g.fill(); });
