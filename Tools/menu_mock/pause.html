<style>
@font-face { font-family: Play; src: url(../../Assets/Resources/Fonts/Play-Regular.ttf); }

* { box-sizing: border-box; margin: 0; }
body { width: 1920px; height: 1080px; overflow: hidden; background: #03070F; font-family: Play, sans-serif; color: #EAF6FA; }

.g { background: #1D4D2A; color: #CFFFE0; }
.r { background: #4D1F1B; color: #FFD3CC; }
.lbl2 { position: absolute; left: 50%; transform: translateX(-50%); top: 14px; padding: 8px 22px; border-radius: 20px; background: rgba(0,0,0,0.6);

.stat b { display: block; font-size: 26px; } .stat span { font-size: 11px; letter-spacing: 1.5px; font-weight: 700; color: #8DA6AE; }

.tile b { display: block; font-size: 19px; letter-spacing: 2px; margin-top: 18px; } .tile span { font-size: 13px; color: #8DA6AE; }
.hud { position: absolute; left: 50%; transform: translateX(-50%); top: 0; width: 940px; height: 62px; border-radius: 0 0 14px 14px; background: rgba(6,12,24,0.7); border: 1px solid rgba(120,220,215,0.15); opacity: 0.5; }
