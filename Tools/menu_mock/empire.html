<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<!-- Макеты окна «Обзор империи» (1920×1080), три варианта: ?v=a|b|c. Рендер: node Tools/menu_mock/render_empire.js -->
<style>
@font-face { font-family: Play; src: url(../../Assets/Resources/Fonts/Play-Regular.ttf); }
@font-face { font-family: Play; font-weight: 700; src: url(../../Assets/Resources/Fonts/Play-Bold.ttf); }
* { box-sizing: border-box; margin: 0; }
body { width: 1920px; height: 1080px; overflow: hidden; background: #03070F; font-family: Play, sans-serif; color: #EAF6FA; }
#s { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
.bg { position: absolute; inset: -20px; background: url(../../Assets/Resources/Menu/menu_bg.jpg) 30% 60%/cover; filter: blur(6px) brightness(0.4); }
.win { position: absolute; left: 230px; right: 100px; top: 80px; bottom: 50px; background: linear-gradient(180deg, rgba(12,24,44,0.97), rgba(6,12,24,0.98)); border: 1px solid rgba(120,220,215,0.3); border-radius: 18px; box-shadow: 0 30px 70px rgba(0,0,0,0.6); overflow: hidden; }
.mut { color: #8DA6AE; } .cy { color: #6FE6DA; } .gold { color: #FFD27A; } .gr { color: #5CF599; } .rd { color: #FF8A73; } .bl { color: #9FB4FF; }
.h { font-weight: 700; letter-spacing: 3px; font-size: 12px; color: #6FE6DA; }
.card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 18px 20px; }
.b { height: 40px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; letter-spacing: 2.5px; position: relative; clip-path: polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px); background: #16243C; color: #D6E4FF; padding: 0 18px; }
.b::before { content:''; position:absolute; left:0; top:10px; bottom:0; width:3px; background:#6E9BFF; }
.b.q { background:#0F1828; color:#9FB2BE; } .b.q::before { background:#3A4A5E; }
.b.p { background:#6FE3D6; color:#04161A; } .b.p::before { display:none; }
.port { background: url(../../Assets/Resources/Leaders/leader_astrea.jpg) 50% 18%/cover; }
.res { display: flex; gap: 10px; }
.res div { flex: 1; padding: 12px 14px; border-radius: 12px; background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.06); }
.res b { font-size: 22px; } .res span { display: block; font-size: 11px; letter-spacing: 1.5px; font-weight: 700; color: #8DA6AE; margin-bottom: 2px; } .res i { font-style: normal; font-size: 13px; margin-left: 8px; }
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); }
.tabs div { flex: 1; text-align: center; padding: 10px 6px; border-radius: 9px; font-weight: 700; font-size: 13px; color: #9DB3BA; letter-spacing: 1px; }
.tabs div.on { background: rgba(95,230,218,0.20); color: #fff; box-shadow: inset 0 0 0 1px rgba(111,230,218,0.7); }
.row { display: grid; grid-template-columns: 2.2fr 1.6fr 1fr 1fr 1.6fr; align-items: center; padding: 14px 18px; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); margin-bottom: 8px; font-size: 14px; }
.row.hd { background: none; border: none; font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #8DA6AE; padding: 4px 18px; }
.att { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; background: rgba(255,210,122,0.06); border-left: 3px solid #FFD27A; margin-bottom: 8px; font-size: 14px; font-weight: 700; }
.bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); margin-top: 6px; } .bar i { display: block; height: 100%; border-radius: 3px; }
.lbl2 { position: absolute; left: 50%; transform: translateX(-50%); top: 14px; padding: 8px 22px; border-radius: 20px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,210,120,0.6); color: #FFD27A; font-weight: 700; font-size: 18px; letter-spacing: 3px; z-index: 50; }
.close { position: absolute; right: 22px; top: 20px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; border: 1px solid rgba(255,255,255,0.2); font-size: 18px; color: #CFE2E6; }
.ring { width: 86px; height: 86px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 18px; }
.nav div { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-radius: 12px; font-weight: 700; font-size: 16px; color: #9DB3BA; margin-bottom: 6px; }
.nav div.on { color: #fff; background: linear-gradient(90deg, rgba(95,230,218,0.22), rgba(95,230,218,0.03)); box-shadow: inset 3px 0 0 #6FE6DA; }
.nav span { font-size: 13px; padding: 2px 10px; border-radius: 10px; background: rgba(255,255,255,0.06); color: #B9CBD2; }
</style></head>
<body><div id="s"></div>
<script>

const RES = `<div><span>ГЕЛИЙ-3</span><b>220</b><i class="gr">+15/мес</i></div><div><span>ТИТАН</span><b>280</b><i class="gr">+10/мес</i></div><div><span>СПЛАВЫ</span><b>160</b><i class="gr">+5/мес</i></div><div><span>ВЛИЯНИЕ</span><b>60</b><i class="gr">+3,5/мес</i></div><div><span>НАУКА</span><b>30,2</b><i class="mut">/мес</i></div>`;

  <div class="row" style="background:rgba(95,230,218,0.07);border-color:rgba(111,230,218,0.35)"><div><b style="font-size:16px">Улва</b><div class="mut" style="font-size:12px">Столица · орбитальная верфь · оранжевая (K)</div></div><div><b>Форпост</b> <span class="gold">◆◆◆</span><div class="mut" style="font-size:12px">улучшение: 80 мин. · 60 спл.</div></div><div>6 жит.</div><div>—</div><div style="text-align:right"><span class="cy">+8</span> · <span class="gold">+8,8</span> · <span class="rd">+6</span></div></div>

const T = {
a: `<div class="lbl2">ВАРИАНТ A · ШТАБ</div><div class="bg"></div>
  <div class="win">
    <div style="position:relative;height:230px">

      <img src="../../Assets/Resources/Factions/emblem_astrea.png" style="position:absolute;left:400px;top:40px;width:96px">

        <div style="display:flex;gap:10px;margin-top:16px"><div class="b">ЗАКОНЫ ИМПЕРИИ</div><div class="b q">ОФОРМЛЕНИЕ</div></div></div>

    </div>

    <div style="display:grid;grid-template-columns:1fr 420px;gap:22px;padding:20px 30px">
      <div><div class="tabs" style="margin-bottom:14px"><div class="on">Системы · 1</div><div>Флоты · 3</div><div>Лидеры</div><div>Узлы</div><div>Соперники</div><div>Эффекты</div></div>${ROWS}</div>
      <div style="display:flex;flex-direction:column;gap:16px">

        <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div class="h">ПУТЬ К ПОБЕДЕ</div><div class="b q" style="height:30px;font-size:11px">ПОДРОБНЕЕ</div></div>${VIC('100%')}</div>
      </div></div>

b: `<div class="lbl2">ВАРИАНТ B · ДАШБОРД</div><div class="bg"></div>
  <div class="win" style="padding:26px 30px">
    <div style="display:flex;align-items:center;gap:20px;margin-bottom:20px">

      <div class="b" style="height:44px">ЗАКОНЫ ИМПЕРИИ</div><div class="close" style="position:static">✕</div></div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:auto auto;gap:16px">
      <div class="card" style="grid-column:span 2"><div class="h" style="margin-bottom:12px">ЭКОНОМИКА</div><div class="res">${RES}</div>
        <svg width="100%" height="90" viewBox="0 0 700 90" style="margin-top:12px"><polyline points="0,70 100,64 200,60 300,52 400,48 500,40 600,30 700,22" fill="none" stroke="#6FE6DA" stroke-width="3"/><polyline points="0,80 100,78 200,72 300,70 400,66 500,62 600,60 700,52" fill="none" stroke="#FFD27A" stroke-width="2"/></svg></div>

</script></body></html>
