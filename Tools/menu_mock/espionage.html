<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<!-- Макеты окна «Тайные операции» (1920×1080), три варианта: ?v=a|b|c. Рендер: node Tools/menu_mock/render_espionage.js -->
<style>
@font-face { font-family: Play; src: url(../../Assets/Resources/Fonts/Play-Regular.ttf); }
@font-face { font-family: Play; font-weight: 700; src: url(../../Assets/Resources/Fonts/Play-Bold.ttf); }
* { box-sizing: border-box; margin: 0; }
body { width: 1920px; height: 1080px; overflow: hidden; background: #03070F; font-family: Play, sans-serif; color: #EAF6FA; }
#s { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
.bg { position: absolute; inset: -20px; background: url(../../Assets/Resources/Menu/menu_bg.jpg) 70% 40%/cover; filter: blur(6px) brightness(0.35) hue-rotate(40deg); }
.win { position: absolute; left: 40px; right: 40px; top: 28px; bottom: 22px; background: linear-gradient(180deg, rgba(16,14,40,0.97), rgba(7,8,22,0.98)); border: 1px solid rgba(189,143,255,0.32); border-radius: 18px; box-shadow: 0 30px 70px rgba(0,0,0,0.6); overflow: hidden; }
.mut { color: #8DA2B4; } .pu { color: #BD8FFF; } .gold { color: #FFD27A; } .gr { color: #5CF599; } .rd { color: #FF7A7A; } .cy { color: #66E0D0; }
.h { font-weight: 700; letter-spacing: 3px; font-size: 12px; color: #BD8FFF; }
.card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; }
.b { height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 12px; letter-spacing: 2px; position: relative; clip-path: polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px); background: #1E1A3C; color: #E2D6FF; padding: 0 16px; white-space: nowrap; }
.b::before { content:''; position:absolute; left:0; top:10px; bottom:0; width:3px; background:#BD8FFF; }
.b.q { background:#121428; color:#9FA8C0; } .b.q::before { background:#3A3F5E; }
.b.p { background:#BD8FFF; color:#140A26; } .b.p::before { display:none; }
.b.dis { background:#14152A; color:#5E6680; } .b.dis::before { background:#2A2E44; }
.b img { width: 18px; height: 18px; }
.close { position: absolute; right: 22px; top: 20px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; border: 1px solid rgba(255,255,255,0.2); font-size: 18px; color: #CFE2E6; z-index: 5; }
.lbl2 { position: absolute; left: 50%; transform: translateX(-50%); top: 6px; padding: 6px 20px; border-radius: 20px; background: rgba(0,0,0,0.7); border: 1px solid rgba(255,210,120,0.6); color: #FFD27A; font-weight: 700; font-size: 16px; letter-spacing: 3px; z-index: 50; }
.bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); position: relative; } .bar > i { display: block; height: 100%; border-radius: 3px; }
.tag { display:inline-block; padding: 3px 9px; border-radius: 6px; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
.por { border-radius: 12px; object-fit: cover; flex: none; }
.ico { width: 22px; height: 22px; object-fit: contain; }
.pill { display:inline-flex; align-items:center; gap:6px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); }
</style></head>
<body><div id="s"></div>
<script>
const v = (new URLSearchParams(location.search).get('v') || 'a');
const IC = n => `../../Assets/Resources/UI/Icons/${n}.png`;
const POR = n => `../../Assets/Resources/Leaders/Pool/${n}.jpg`;
const EMB = n => `../../Assets/Resources/Factions/emblem_${n}.png`;
const HEAD = (sub) => `<div style="position:absolute;left:34px;top:24px;display:flex;gap:16px;align-items:center"><div style="width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(189,143,255,0.35),rgba(189,143,255,0.05));border:1px solid rgba(189,143,255,0.5)"><img src="${IC('target')}" style="width:32px"></div><div><div class="h">АГЕНТОВ 3 · УСПЕХОВ 4 · ПРОВАЛОВ 1 · ЗАЩИТА ИМПЕРИИ <span style="color:#fff">34%</span></div><div style="font-weight:700;font-size:34px;margin-top:2px">Тайные операции</div></div></div>${sub||''}<div class="close">✕</div>`;

// данные
const EMP = [
  {id:'xarn', n:'Ксарнская Орда', c:'#FF6A5C', op:-35, war:true, def:22, net:43, agent:'agt_1', agentN:'Дарен Вос', sys:'Кетра IV', role:'столица'},
  {id:'iridia', n:'Иридианский Союз', c:'#5FB8FF', op:+20, pact:true, def:31, net:18, agent:'agt_3', agentN:'Таль Мерис', sys:'Ойя', role:'колония'},
  {id:'nol', n:'Ноль-Синдикат', c:'#E6D25C', op:-5, def:40, net:6, agent:null},
  {id:'aquila', n:'Аквилейский Доминион', c:'#5CF599', op:0, def:18, net:0, agent:null, unknown:true},
];
const MS = [[15,'star','Видимость'],[20,'globe','Обзор'],[25,'construction','Диверсия'],[30,'res_research','Чертежи'],[40,'target','Кража'],[50,'diplomacy','Досье · Раздор']];
const OPS = [
  ['Кража технологии','res_research',40,20,3,47,'Изучает технологию, которой у вас нет'],
  ['Диверсия','construction',25,15,2,61,'Цель теряет сплавы и гелий-3'],
  ['Раздор','swords',50,25,3,52,'Стравливает цель с другой империей'],
];
const LOG = [
  ['03.2231',1,'Кража у Ксарнской Орды: «Плазменные пушки II»'],
  ['01.2231',3,'Раскрыт агент Иридии — диверсия на верфях сорвана'],
  ['11.2230',2,'Таль Мерис «сгорел»: сеть в Иридии −50%'],
  ['08.2230',1,'Диверсия у Ксарнской Орды: −120 сплавов'],
  ['06.2230',0,'Сеть в Ксарнской Орде достигла 20% — обзор'],
];
const LC = ['#8DA2B4','#5CF599','#FF7A7A','#FFB15C'];

// шкала сети с узлами-наградами
const TRACK = (net, w, compact) => `<div style="position:relative;width:${w}px;height:${compact?44:76}px">
  <div class="bar" style="position:absolute;left:0;right:0;top:${compact?12:20}px;height:${compact?6:8}px"><i style="width:${((compact?14:20)+Math.min(net,50)/50*(w-(compact?28:40)))/w*100}%;background:linear-gradient(90deg,#7E5CFF,#BD8FFF)"></i></div>
  ${MS.map(([c,ic,t])=>{const on=net>=c, x=(compact?14:20)+c/50*(w-(compact?28:40)); return `<div style="position:absolute;left:${x-(compact?13:18)}px;top:${compact?2:6}px;width:${compact?26:36}px;height:${compact?26:36}px;border-radius:50%;display:grid;place-items:center;background:${on?'#2A1F55':'#10122A'};border:2px solid ${on?'#BD8FFF':'rgba(255,255,255,0.15)'};${on?'box-shadow:0 0 14px rgba(189,143,255,0.6)':''}"><img src="${IC(ic)}" style="width:${compact?14:20}px;${on?'':'opacity:0.35'}"></div>${compact?'':`<div style="position:absolute;left:${x-50}px;top:48px;width:100px;text-align:center;font-size:11px;font-weight:700;color:${on?'#E2D6FF':'#6E7890'}">${c}% · ${t}</div>`}`}).join('')}
</div>`;

const OPCARD = (o, net, w, h, sel) => { const ok = net>=o[2]; return `<div class="card" style="width:${w}px;${h?`height:${h}px;`:''}padding:16px;display:flex;flex-direction:column;gap:10px;${sel?'border-color:#BD8FFF;box-shadow:0 0 0 1px #BD8FFF66;background:rgba(189,143,255,0.08)':''}${ok?'':'opacity:0.6'}">
  <div style="display:flex;gap:12px;align-items:center"><div style="width:46px;height:46px;border-radius:12px;background:rgba(189,143,255,0.14);display:grid;place-items:center;flex:none"><img src="${IC(o[1])}" style="width:28px"></div><div style="flex:1"><div style="font-weight:700;font-size:16px">${o[0]}</div><div class="mut" style="font-size:12px;margin-top:2px">${o[6]}</div></div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill" style="color:${ok?'#5CF599':'#8DA2B4'}">${ok?o[5]+'%':'—'} успех</span><span class="pill"><img src="${IC('res_influence')}" style="width:14px">${o[3]}</span><span class="pill">⏱ ${o[4]} мес.</span></div>
  <div class="b ${ok?(sel?'p':''):'dis'}" style="margin-top:auto">${ok?(o[0]=='Раздор'?'ВЫБРАТЬ, КОГО СТРАВИТЬ':'НАЧАТЬ'):`🔒 СЕТЬ ${o[2]}% · ЕЩЁ ${o[2]-net}%`}</div></div>`; };

const LOGLIST = (n, fs) => LOG.slice(0,n).map(([d,k,t])=>`<div style="display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:${fs||13}px"><span style="width:8px;height:8px;border-radius:50%;background:${LC[k]};margin-top:6px;flex:none"></span><span class="mut" style="width:62px;flex:none">${d}</span><span>${t}</span></div>`).join('');

const T = {
// ===================== A: ЦЕЛИ =====================
a: () => `<div class="lbl2">ВАРИАНТ A · ИМПЕРИИ-ЦЕЛИ</div><div class="bg"></div>
 <div class="win">${HEAD(`<div style="position:absolute;right:80px;top:34px;display:flex;gap:10px"><div class="b q"><img src="${IC('globe')}">КАРТА СЕТИ</div><div class="b q"><img src="${IC('leader')}">НАНЯТЬ АГЕНТА ★40</div></div>`)}
  <!-- список империй -->
  <div style="position:absolute;left:34px;top:116px;width:400px;bottom:24px;display:flex;flex-direction:column;gap:10px">
   <div class="h" style="margin-left:4px">ИЗВЕСТНЫЕ ИМПЕРИИ</div>
   ${EMP.map((e,i)=>`<div class="card" style="padding:14px 16px;display:flex;gap:14px;align-items:center;${i==0?`border-color:${e.c};background:linear-gradient(90deg,${e.c}26,transparent 70%);box-shadow:inset 3px 0 0 ${e.c}`:''}${e.unknown?'opacity:0.5':''}">
     <img src="${EMB(e.id)}" style="width:52px;height:52px;object-fit:contain"><div style="flex:1"><div style="font-weight:700;font-size:16px">${e.n}</div>
     <div style="font-size:12px;margin-top:3px">${e.war?'<span class="rd">война</span>':e.pact?'<span class="gr">пакт</span>':'<span class="mut">мир</span>'} <span class="mut">· защита ${e.def}%</span></div>
     <div style="display:flex;gap:8px;align-items:center;margin-top:7px"><div class="bar" style="flex:1"><i style="width:${e.net*2}%;background:#BD8FFF"></i></div><span style="font-size:12px;font-weight:700;width:34px;text-align:right" class="${e.net?'pu':'mut'}">${e.net}%</span></div></div>
     ${e.agent?`<img class="por" src="${POR(e.agent)}" style="width:44px;height:44px;border-radius:50%;border:2px solid #BD8FFF">`:`<div style="width:44px;height:44px;border-radius:50%;border:2px dashed rgba(255,255,255,0.2);display:grid;place-items:center;color:#6E7890;font-size:20px">+</div>`}</div>`).join('')}
   <div class="card" style="margin-top:auto;padding:14px 16px;display:flex;gap:14px;align-items:center;border-color:rgba(102,224,208,0.35)"><div style="width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgba(102,224,208,0.12)"><img src="${IC('shielddome')}" style="width:30px"></div><div style="flex:1"><div style="font-weight:700;font-size:16px">Контрразведка</div><div class="mut" style="font-size:12px;margin-top:3px">защита <b class="cy">34%</b> · сорвано 3 чужих операции</div></div><img class="por" src="${POR('agt_2')}" style="width:44px;height:44px;border-radius:50%;border:2px solid #66E0D0"></div>
  </div>
  <!-- центр: цель -->
  <div style="position:absolute;left:458px;right:34px;top:116px;bottom:24px">
   <div class="card" style="position:absolute;left:0;right:0;top:0;height:250px;padding:24px 28px;overflow:hidden;background:radial-gradient(ellipse at 90% 0%,rgba(255,106,92,0.18),transparent 55%),rgba(255,255,255,0.03)">
    <img src="${EMB('xarn')}" style="position:absolute;right:30px;top:-10px;width:200px;opacity:0.18">
    <div style="display:flex;gap:22px;align-items:center">
     <img class="por" src="${POR('agt_1')}" style="width:100px;height:100px;border:2px solid #BD8FFF">
     <div><div class="h">АГЕНТ В ИМПЕРИИ</div><div style="font-weight:700;font-size:28px;margin-top:2px">Дарен Вос <span class="mut" style="font-size:16px">· уровень 3</span></div>
      <div style="font-size:13px;margin-top:6px"><span class="gold">Расхититель · Тень</span> <span class="mut">· система</span> Кетра IV <span class="mut">(столица) · сеть здесь 71%</span></div></div>
     <div style="margin-left:auto;display:flex;gap:10px"><div class="b q"><img src="${IC('target')}">СМЕНИТЬ СИСТЕМУ</div><div class="b q">ОТОЗВАТЬ</div></div>
    </div>
    <div style="display:flex;align-items:flex-end;gap:30px;margin-top:22px"><div><div class="mut" style="font-size:11px;font-weight:700;letter-spacing:2px">РАЗВЕДСЕТЬ</div><div style="font-weight:700;font-size:44px;line-height:1" class="pu">43%</div><div class="gr" style="font-size:12px;margin-top:4px">+2,4% / мес</div></div>
     ${TRACK(43, 1000)}</div>
   </div>
   <div class="h" style="position:absolute;left:4px;top:272px">ОПЕРАЦИИ</div>
   <div style="position:absolute;left:0;right:0;top:296px;display:flex;gap:16px">${OPS.map((o,i)=>OPCARD(o,43,432,214,i==0)).join('')}</div>
   <div class="card" style="position:absolute;left:0;width:660px;top:530px;bottom:0;padding:20px 24px"><div class="h" style="color:#FF6A5C">ДОСЬЕ · КСАРНСКАЯ ОРДА <span class="mut" style="letter-spacing:1px">· откроется при 50%</span></div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px">${[['res_alloys','Сплавы','≈ 2 400'],['res_energy','Гелий-3','???'],['res_research','Наука','???'],['fleet','Мощь флота','≈ 1,4×']].map(([ic,n,val],i)=>`<div class="card" style="padding:12px;${i>0&&i<3?'opacity:0.45':''}"><img src="${IC(ic)}" style="width:22px"><div class="mut" style="font-size:11px;margin-top:6px">${n}</div><div style="font-weight:700;font-size:18px">${val}</div></div>`).join('')}</div>
    <div class="mut" style="font-size:12px;margin-top:12px">Обзор (20%) уже открыт: территория и флоты цели видны на карте.</div></div>
   <div class="card" style="position:absolute;left:676px;right:0;top:530px;bottom:0;padding:20px 24px"><div class="h">ЖУРНАЛ</div><div style="margin-top:6px">${LOGLIST(4)}</div></div>
  </div>
 </div>`,

// ===================== B: КАРТА СЕТИ =====================
b: () => { const nodes=[[300,250,'Кетра IV',71,'cap'],[180,140,'Вейн',43],[460,160,'Оро',43],[420,360,'Сигма Лиры',43],[170,380,'Дрем',21],[620,250,'Халь',21],[580,450,'Тикк',21,'col'],[300,520,'Мирах',8],[760,130,'Ар-Кос',6],[800,380,'Зефф',4],[60,250,'Ульм',21,'col'],[700,560,'Ном',2]];
  const edges=[[0,1],[0,2],[0,3],[0,4],[2,5],[3,6],[3,5],[4,7],[5,8],[5,9],[1,10],[4,10],[6,11],[9,11],[6,7]];
  return `<div class="lbl2">ВАРИАНТ B · КАРТА СЕТИ</div><div class="bg"></div>
 <div class="win">${HEAD(`<div style="position:absolute;left:740px;top:36px;display:flex;gap:8px">${EMP.slice(0,3).map((e,i)=>`<div style="display:flex;gap:10px;align-items:center;padding:8px 16px 8px 10px;border-radius:12px;${i==0?`background:${e.c}22;box-shadow:inset 0 0 0 1px ${e.c}`:'background:rgba(255,255,255,0.04)'}"><img src="${EMB(e.id)}" style="width:30px"><b style="font-size:14px">${e.n}</b><span class="pu" style="font-weight:700;font-size:13px">${e.net}%</span></div>`).join('')}<div style="display:flex;align-items:center;padding:8px 16px;border-radius:12px;background:rgba(102,224,208,0.08);color:#66E0D0;font-weight:700;font-size:14px;gap:8px"><img src="${IC('shielddome')}" style="width:22px">Контрразведка 34%</div></div>`)}
  <!-- карта -->
  <div style="position:absolute;left:34px;top:116px;width:960px;bottom:150px;border-radius:16px;overflow:hidden;border:1px solid rgba(255,106,92,0.25);background:radial-gradient(ellipse at 32% 42%,rgba(189,143,255,0.18),transparent 45%),radial-gradient(circle at 50% 50%,rgba(255,106,92,0.06),transparent 70%),rgba(0,0,0,0.3)">
   <div style="position:absolute;left:24px;top:20px"><div class="h" style="color:#FF6A5C">ТЕРРИТОРИЯ КСАРНСКОЙ ОРДЫ</div><div class="mut" style="font-size:12px;margin-top:4px">Сеть сильнее всего в системе агента, ×0,6 у соседей, ×0,3 дальше. Клик по системе — перенести агента.</div></div>
   <svg style="position:absolute;left:40px;top:90px" width="900" height="640">
    <defs><radialGradient id="g"><stop offset="0" stop-color="#BD8FFF" stop-opacity="0.55"/><stop offset="1" stop-color="#BD8FFF" stop-opacity="0"/></radialGradient></defs>
    ${nodes.map(([x,y,n,p])=>`<circle cx="${x}" cy="${y}" r="${30+p*1.1}" fill="url(#g)" opacity="${Math.min(1,p/60+0.1)}"/>`).join('')}
    <g stroke="rgba(255,255,255,0.18)" stroke-width="2">${edges.map(([a,b])=>`<line x1="${nodes[a][0]}" y1="${nodes[a][1]}" x2="${nodes[b][0]}" y2="${nodes[b][1]}"/>`).join('')}</g>
    ${nodes.map(([x,y,n,p,k],i)=>`<circle cx="${x}" cy="${y}" r="${i==0?16:11}" fill="${p>=15?'#2A1F55':'#14162A'}" stroke="${p>=15?'#BD8FFF':'#FF6A5C88'}" stroke-width="2"/>${k=='cap'?`<circle cx="${x}" cy="${y}" r="24" fill="none" stroke="#FFD27A" stroke-width="2" stroke-dasharray="4 4"/>`:''}
      <text x="${x}" y="${y+(i==0?44:32)}" fill="${p>=15?'#EAF6FA':'#7A8296'}" font-family="Play" font-size="14" font-weight="700" text-anchor="middle">${n}</text><text x="${x}" y="${y+(i==0?62:49)}" fill="${p>=15?'#BD8FFF':'#5E6680'}" font-family="Play" font-size="12" text-anchor="middle">${p}%${k=='cap'?' · столица':k=='col'?' · колония':''}</text>`).join('')}
   </svg>
   <img class="por" src="${POR('agt_1')}" style="position:absolute;left:${40+300-26}px;top:${90+250-82}px;width:52px;height:52px;border-radius:50%;border:3px solid #BD8FFF;box-shadow:0 0 20px #BD8FFF">
   <div style="position:absolute;left:24px;bottom:20px;display:flex;gap:18px;font-size:12px" class="mut"><span><b class="pu">●</b> сеть ≥ 15% — система видна</span><span><b style="color:#FFD27A">◌</b> столица ×3 к весу</span><span>колония ×2</span></div>
   <div class="card" style="position:absolute;right:20px;bottom:20px;padding:14px 18px;width:260px;background:rgba(8,8,20,0.85)"><div class="mut" style="font-size:11px;font-weight:700;letter-spacing:2px">СЕТЬ В ИМПЕРИИ</div><div style="display:flex;align-items:baseline;gap:10px"><span class="pu" style="font-size:40px;font-weight:700">43%</span><span class="gr" style="font-size:13px">+2,4% / мес</span></div><div class="mut" style="font-size:12px">среднее по системам с весами</div></div>
  </div>
  <!-- правая панель -->
  <div style="position:absolute;left:1018px;right:34px;top:116px;bottom:150px;display:flex;flex-direction:column;gap:14px">
   <div class="card" style="padding:18px 20px;display:flex;gap:16px;align-items:center"><img class="por" src="${POR('agt_1')}" style="width:76px;height:76px"><div style="flex:1"><div style="font-weight:700;font-size:22px">Дарен Вос <span class="mut" style="font-size:14px">· ур. 3</span></div><div class="gold" style="font-size:13px;margin-top:3px">Расхититель · Тень</div><div class="mut" style="font-size:12px;margin-top:3px">в системе Кетра IV · опыт 62%</div></div><div class="b q">ОТОЗВАТЬ</div></div>
