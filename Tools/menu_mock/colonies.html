<!doctype html>
<html lang="ru"><head><meta charset="utf-8">

<style>

* { box-sizing: border-box; margin: 0; }
body { width: 1920px; height: 1080px; overflow: hidden; background: #03070F; font-family: Play, sans-serif; color: #EAF6FA; }
#s { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
.bg { position: absolute; inset: -20px; background: url(../../Assets/Resources/Menu/menu_bg.jpg) 30% 60%/cover; filter: blur(6px) brightness(0.4); }
.win { position: absolute; left: 40px; right: 40px; top: 28px; bottom: 22px; background: linear-gradient(180deg, rgba(12,24,44,0.97), rgba(6,12,24,0.98)); border: 1px solid rgba(120,220,215,0.3); border-radius: 18px; box-shadow: 0 30px 70px rgba(0,0,0,0.6); overflow: hidden; }

.h { font-weight: 700; letter-spacing: 3px; font-size: 12px; color: #6FE6DA; }
.card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; }
.b { height: 38px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; letter-spacing: 2px; position: relative; clip-path: polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px); background: #16243C; color: #D6E4FF; padding: 0 16px; white-space: nowrap; }
.b::before { content:''; position:absolute; left:0; top:9px; bottom:0; width:3px; background:#6E9BFF; }
.b.q { background:#0F1828; color:#9FB2BE; } .b.q::before { background:#3A4A5E; }
.b.g::before { background:#4FD98A; } .b.on { background:#173A33; color:#BFF5DF; } .b.on::before { background:#4FD98A; }
.b.p { background:#6FE3D6; color:#04161A; } .b.p::before { display:none; }
.close { position: absolute; right: 22px; top: 20px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; border: 1px solid rgba(255,255,255,0.2); font-size: 18px; color: #CFE2E6; }
.lbl2 { position: absolute; left: 50%; transform: translateX(-50%); top: 6px; padding: 6px 20px; border-radius: 20px; background: rgba(0,0,0,0.7); border: 1px solid rgba(255,210,120,0.6); color: #FFD27A; font-weight: 700; font-size: 16px; letter-spacing: 3px; z-index: 50; }
.bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); } .bar i { display: block; height: 100%; border-radius: 3px; }
.pl { border-radius: 50%; flex: none; box-shadow: inset -10px -8px 18px rgba(0,0,0,0.65), 0 0 18px rgba(255,255,255,0.06); }
.p1 { background: radial-gradient(circle at 35% 30%, #F5D58A, #C9862F 55%, #6B3A12); }
.p2 { background: radial-gradient(circle at 35% 30%, #9EE7FF, #2C7FB8 50%, #0E2E55); }
.p3 { background: radial-gradient(circle at 35% 30%, #B9F59A, #3E9B52 50%, #123A22); }
.p4 { background: radial-gradient(circle at 35% 30%, #F0B3FF, #8A4FC4 50%, #2A1550); }
.p5 { background: radial-gradient(circle at 35% 30%, #E8E8EE, #8C95A6 50%, #2D3440); }

.seg { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); }
.seg div { flex: 1; text-align: center; padding: 9px 12px; border-radius: 9px; font-weight: 700; font-size: 13px; color: #9DB3BA; letter-spacing: 1px; white-space: nowrap; }
.seg div.on { background: rgba(95,230,218,0.20); color: #fff; box-shadow: inset 0 0 0 1px rgba(111,230,218,0.7); }
.res { display: flex; gap: 10px; }
.res div { flex: 1; padding: 10px 14px; border-radius: 12px; background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.06); }
.res b { font-size: 20px; } .res span { display: block; font-size: 11px; letter-spacing: 1.5px; font-weight: 700; color: #8DA6AE; margin-bottom: 2px; } .res i { font-style: normal; font-size: 13px; margin-left: 8px; }
.att { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: rgba(255,210,122,0.06); border-left: 3px solid #FFD27A; margin-bottom: 8px; font-size: 13px; font-weight: 700; }
.att.ok { background: rgba(92,245,153,0.05); border-color: #5CF599; }
.ring { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 16px; flex: none; }
.prod { display: flex; gap: 14px; font-weight: 700; font-size: 15px; }
.prod span small { display:block; font-size: 10px; letter-spacing: 1px; color:#8DA6AE; font-weight:700; }
</style></head>
<body><div id="s"></div>

const C = [
 {n:'Гиперион', cls:'Пустынный мир · столица', p:'p1', pop:6, hou:6, st:65, sl:'Спокойствие', e:'+7,2', m:'+7,6', a:'+5,4', s:'+6,6', f:'Равномерно', job:null, auto:false, warn:'нет жилья'},

a: () => `<div class="lbl2">ВАРИАНТ A · ПУЛЬТ</div><div class="bg"></div>

      ${[['Гелий-3','220','+15','cy'],['Титан','280','+13','gold'],['Сплавы','160','+10','or'],['Влияние','60','+4','bl'],['Наука','','+30 / мес','gr']].map(([n,a,b,c])=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid rgba(255,255,255,0.05);font-size:14px"><span class="${c}" style="font-weight:700">${n}</span><span><b>${a}</b> <span class="gr">${b}</span></span></div>`).join('')}

    <div style="flex:1"></div>
    <div class="b g" style="width:100%">ВКЛЮЧИТЬ АВТОСТРОЙКУ ВЕЗДЕ</div>
  </div>
  <div style="position:absolute;left:390px;right:34px;top:130px;display:flex;gap:12px;align-items:center"><div class="seg" style="width:520px"><div class="on">Все · 5</div><div>Простаивают · 2</div><div>Нет жилья · 1</div></div><div style="flex:1"></div><div class="seg" style="width:340px"><div class="on">Жители ▾</div><div>Стабильность</div><div>Доход</div></div></div>
  <div style="position:absolute;left:390px;right:34px;top:196px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
   ${C.map(c=>`<div class="card" style="overflow:hidden;${!c.job&&!c.auto?'border-color:rgba(255,210,122,0.45)':''}">

       <div class="pl ${c.p}" style="position:absolute;right:-30px;top:-34px;width:180px;height:180px"></div>
       <div style="position:absolute;left:20px;top:20px"><div style="font-weight:700;font-size:22px">${c.n}</div><div class="mut" style="font-size:12px;margin-top:2px">${c.cls}</div>
       <div style="margin-top:10px"><span class="tag" style="background:rgba(111,230,218,0.12);color:#9EEFE6">${c.f.toUpperCase()}</span>${c.auto?' <span class="tag" style="background:rgba(92,245,153,0.12);color:#8FF5BC">АВТО ✓</span>':''}</div></div>
     </div>
     <div style="padding:14px 20px 18px">
       <div style="display:flex;gap:18px;align-items:center">
         <div style="flex:1"><div class="mut" style="font-size:11px;font-weight:700;letter-spacing:1.5px;margin-bottom:4px">ЖИТЕЛИ</div>${POP(c,150)}</div>
         <div style="flex:1"><div class="mut" style="font-size:11px;font-weight:700;letter-spacing:1.5px;margin-bottom:4px">СТАБИЛЬНОСТЬ</div><div style="font-size:15px;font-weight:700;color:${stc(c.st)}">${c.st} <span style="font-size:12px;font-weight:400">${c.sl}</span></div><div class="bar" style="margin-top:5px"><i style="width:${c.st}%;background:${stc(c.st)}"></i></div></div>

     <div class="card" style="display:grid;place-items:center;border-style:dashed;color:#8DA6AE;font-size:14px;text-align:center;padding:30px">＋<br>Новая колония<br><span style="font-size:12px">выберите пригодную планету<br>и проект «Колония»</span></div>

 </div>`,

   </div>
