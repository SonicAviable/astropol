<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<!-- Макеты подсказки ресурса верхней панели (титан), три варианта. Рендер: node Tools/menu_mock/render_restip.js -->
<style>
@font-face { font-family: Play; src: url(../../Assets/Resources/Fonts/Play-Regular.ttf); }
@font-face { font-family: Play; font-weight: 700; src: url(../../Assets/Resources/Fonts/Play-Bold.ttf); }
@font-face { font-family: Russo; src: url(../../Assets/Resources/Fonts/RussoOne-Regular.ttf); }
* { box-sizing: border-box; margin: 0; }
body { width: 1920px; height: 1080px; overflow: hidden; font-family: Play; color: #EAF6FA; background: radial-gradient(ellipse at 50% 0%, #10161b, #05080a 70%); }
.col { position: absolute; top: 30px; width: 620px; }
.col h2 { font: 24px Russo; color: #FFC24D; letter-spacing: 2px; text-align: center; }
.col .d { font-size: 14px; color: #9FB2BC; text-align: center; margin: 8px 20px 0; line-height: 1.4; height: 60px; }
.bar { position: relative; margin: 14px auto 0; width: 300px; height: 64px; background: #0c1418; border: 1px solid rgba(111,230,218,.35); clip-path: polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%); display: flex; align-items: center; gap: 12px; padding: 0 26px; }
.bar .ic { width: 30px; height: 30px; }
.bar .n { font: 700 10px Play; letter-spacing: 2px; color: #9FB2BC; } .bar .v { font: 24px Russo; } .bar .g { font: 700 13px Play; color: #5CE08F; margin-left: 6px; }
.tip { margin: 10px auto 0; width: 460px; background: rgba(6,12,15,.97); border: 1px solid rgba(111,230,218,.45); box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 30px rgba(111,230,218,.08); }
.cy { color: #6FE6DA; } .gr { color: #5CE08F; } .mu { color: #8FA3AD; } .dim { color: #55666e; } .rd { color: #FF8A7A; } .gd { color: #FFC24D; }
svg { display: block; }
/* A */
.A .hd { display: flex; align-items: center; gap: 14px; padding: 16px 18px 12px; }
.A .hd .t { font: 18px Russo; letter-spacing: 1px; } .A .hd .s { font-size: 12px; color: #8FA3AD; margin-top: 2px; }
.A .hd .big { margin-left: auto; text-align: right; } .A .hd .big b { font: 26px Russo; } .A .hd .big span { display: block; font: 700 13px Play; }
.A .stock { padding: 0 18px 14px; } .A .track { height: 8px; border-radius: 4px; background: rgba(255,255,255,.07); overflow: hidden; } .A .track i { display: block; height: 100%; width: 9.3%; background: linear-gradient(90deg,#2aa89e,#6FE6DA); box-shadow: 0 0 10px #6FE6DA; }
.A .stock .lbl { display: flex; justify-content: space-between; font-size: 11px; color: #8FA3AD; margin-top: 5px; }
.A .sec { padding: 10px 18px 4px; font: 700 10px Play; letter-spacing: 3px; color: #6F8794; border-top: 1px solid rgba(111,230,218,.12); }
.A .row { display: grid; grid-template-columns: 22px 1fr 120px 64px; align-items: center; gap: 8px; padding: 5px 18px; font-size: 13px; }
.A .row .b { height: 6px; border-radius: 3px; background: rgba(255,255,255,.05); overflow: hidden; } .A .row .b i { display: block; height: 100%; background: #5CE08F; }
.A .row .v { text-align: right; font-weight: 700; }
.A .row.z { color: #55666e; }
.A .tot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding: 12px 18px; background: rgba(92,224,143,.06); border-top: 1px solid rgba(92,224,143,.25); font: 700 14px Play; }
.A .tot b { font: 20px Russo; color: #5CE08F; }
.A .ft { padding: 10px 18px 14px; font-size: 12px; color: #8FA3AD; line-height: 1.45; }
/* B */
.B { width: 420px; border-radius: 10px; overflow: hidden; }
.B .top { padding: 18px 20px 6px; display: flex; align-items: flex-end; gap: 10px; }
.B .top .v { font: 40px Russo; line-height: 1; } .B .top .cap { font-size: 13px; color: #8FA3AD; margin-bottom: 4px; }
.B .top .d { margin-left: auto; text-align: right; } .B .top .d b { font: 22px Russo; color: #5CE08F; } .B .top .d span { display: block; font-size: 11px; color: #8FA3AD; }
.B .spark { padding: 4px 20px 0; }
.B .eta { margin: 6px 20px 12px; font-size: 12px; color: #8FA3AD; }
.B .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px 14px; }
.B .cell { border-radius: 8px; padding: 10px 12px; background: rgba(255,255,255,.03); border: 1px solid rgba(111,230,218,.15); }
.B .cell .n { font-size: 11px; color: #8FA3AD; } .B .cell .x { font: 18px Russo; margin-top: 2px; }
.B .cell.on { border-color: rgba(92,224,143,.45); background: rgba(92,224,143,.07); } .B .cell.on .x { color: #5CE08F; }
.B .cell.off .x { color: #4d5d64; } .B .cell.off .h { font-size: 11px; color: #6FE6DA; margin-top: 3px; }
.B .tipline { padding: 10px 20px 14px; font-size: 12px; color: #8FA3AD; border-top: 1px solid rgba(111,230,218,.12); line-height: 1.45; }
/* C */
.C { width: 520px; }
.C .hd { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid rgba(111,230,218,.2); font: 700 12px Play; letter-spacing: 3px; color: #6FE6DA; background: linear-gradient(90deg, rgba(111,230,218,.14), transparent 70%); }
.C .hd b { font: 18px Russo; letter-spacing: 1px; color: #fff; }
.C .ft { padding: 10px 18px 14px; font-size: 12px; color: #8FA3AD; line-height: 1.45; border-top: 1px solid rgba(111,230,218,.12); }
</style></head><body>
<script>
const CY = '#6FE6DA', GR = '#5CE08F';
const crystal = (s = 30, c = CY) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 30 30"><path d="M15 3 L21 12 L15 27 L9 12 Z" fill="${c}" opacity=".95"/><path d="M8 9 L11 14 L8 24 L4 15 Z M22 9 L26 15 L22 24 L19 14 Z" fill="${c}" opacity=".6"/></svg>`;
const bar = `<div class="bar">${crystal()}<div><div class="n">ТИТАН</div><div><span class="v">280</span><span class="g">+10</span></div></div></div>`;

const A = `<div class="tip A">
 <div class="hd">${crystal(34)}<div><div class="t">ТИТАН</div><div class="s">строительство, корабли, районы</div></div>
  <div class="big"><b>280</b><span class="gr">+10 / мес</span></div></div>
 <div class="stock"><div class="track"><i></i></div><div class="lbl"><span>Склад 280 / 3 000</span><span>заполнится через ~272 мес</span></div></div>
 <div class="sec">ДОХОД</div>
 <div class="row">${crystal(16)}<span>База империи</span><div class="b"><i style="width:100%"></i></div><span class="v gr">+10</span></div>
 <div class="row z">${crystal(16, '#3d4b51')}<span>Горные районы</span><div class="b"></div><span class="v">0</span></div>
 <div class="row z">${crystal(16, '#3d4b51')}<span>Добывающие станции</span><div class="b"></div><span class="v">0</span></div>
 <div class="sec">РАСХОД</div>
 <div class="row z">${crystal(16, '#3d4b51')}<span>Переработка на заводах</span><div class="b"></div><span class="v">0</span></div>
 <div class="tot"><span>Итого в месяц</span><b>+10,0</b></div>
 <div class="ft">Склады вмещают <b class="cy">3 000</b> (+200 за колонию) — излишки пропадают. Лишний титан можно потратить в решениях империи.</div>
</div>`;

// B: спарклайн запаса за 12 месяцев + прогноз
let pts = [], fut = [];
for (let i = 0; i < 12; i++) pts.push([10 + i * 30, 70 - (160 + i * 10) / 6]);
for (let i = 11; i < 15; i++) fut.push([10 + i * 30, 70 - (160 + i * 10) / 6]);
const spark = `<svg width="380" height="78"><defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${CY}" stop-opacity=".35"/><stop offset="1" stop-color="${CY}" stop-opacity="0"/></linearGradient></defs>
 <path d="M${pts.map(p => p.join(' ')).join(' L')} L${pts[11][0]} 76 L10 76 Z" fill="url(#gf)"/>
 <path d="M${pts.map(p => p.join(' ')).join(' L')}" fill="none" stroke="${CY}" stroke-width="2"/>
 <path d="M${fut.map(p => p.join(' ')).join(' L')}" fill="none" stroke="${CY}" stroke-width="2" stroke-dasharray="4 4" opacity=".6"/>
 <circle cx="${pts[11][0]}" cy="${pts[11][1]}" r="4" fill="#fff"/>
 <text x="10" y="76" font-size="10" fill="#6F8794" font-family="Play">год назад</text><text x="330" y="76" font-size="10" fill="#6F8794" font-family="Play" text-anchor="end">сейчас</text></svg>`;
const B = `<div class="tip B">
 <div class="top">${crystal(34)}<div><div class="cap">ТИТАН · склад 3 000</div><div class="v">280</div></div><div class="d"><b>+10</b><span>в месяц</span></div></div>
 <div class="spark">${spark}</div>
 <div class="eta">За год: <b class="gr">+120</b> · склад заполнится через ~272 мес</div>
 <div class="grid">
  <div class="cell on"><div class="n">База империи</div><div class="x">+10</div></div>
  <div class="cell off"><div class="n">Горные районы</div><div class="x">0</div><div class="h">▸ построить на планете</div></div>
  <div class="cell off"><div class="n">Добывающие станции</div><div class="x">0</div><div class="h">▸ строителем у залежей</div></div>
  <div class="cell off"><div class="n">Переработка (расход)</div><div class="x">0</div></div>
 </div>
 <div class="tipline">Излишки сверх склада пропадают (+200 места за колонию). Лишний титан — в решениях империи.</div>
</div>`;

// C: схема потока: источники → бак → расход
const src = [['База империи', 10], ['Горные районы', 0], ['Добыв. станции', 0]];
let flow = `<svg width="520" height="250" font-family="Play">`;
src.forEach(([n, v], i) => {
  const y = 50 + i * 62, on = v > 0, c = on ? GR : '#33434a';
  flow += `<rect x="16" y="${y - 20}" width="150" height="40" rx="6" fill="${on ? 'rgba(92,224,143,.08)' : 'rgba(255,255,255,.02)'}" stroke="${c}" stroke-opacity="${on ? .6 : .5}"/>
   <text x="28" y="${y - 3}" font-size="12" fill="${on ? '#CFE' : '#5a6b72'}">${n}</text><text x="28" y="${y + 13}" font-size="14" font-weight="700" fill="${on ? GR : '#4d5d64'}">${on ? '+' + v : '0'} / мес</text>
   <path d="M166 ${y} C 210 ${y}, 210 125, 236 125" fill="none" stroke="${c}" stroke-width="${on ? 4 : 1.5}" ${on ? '' : 'stroke-dasharray="3 4"'} opacity="${on ? .9 : .6}"/>`;
});
flow += `<rect x="236" y="30" width="64" height="190" rx="10" fill="rgba(255,255,255,.03)" stroke="${CY}" stroke-opacity=".6"/>
 <rect x="240" y="${216 - 182 * 0.093}" width="56" height="${182 * 0.093}" rx="6" fill="${CY}" opacity=".85"/>
 ${[0.25, 0.5, 0.75].map(k => `<line x1="236" x2="246" y1="${216 - 182 * k}" y2="${216 - 182 * k}" stroke="${CY}" stroke-opacity=".5"/>`).join('')}
 <text x="268" y="22" font-size="11" fill="#8FA3AD" text-anchor="middle">3 000</text>
 <text x="268" y="${206 - 182 * 0.093}" font-size="18" fill="#fff" text-anchor="middle" font-family="Russo">280</text>
 <path d="M300 125 C 330 125, 330 125, 360 125" fill="none" stroke="#33434a" stroke-width="1.5" stroke-dasharray="3 4"/>
 <rect x="360" y="105" width="144" height="40" rx="6" fill="rgba(255,255,255,.02)" stroke="#33434a"/>
 <text x="372" y="122" font-size="12" fill="#5a6b72">Заводы (расход)</text><text x="372" y="138" font-size="14" font-weight="700" fill="#4d5d64">0 / мес</text>
 <text x="432" y="190" font-size="12" fill="#8FA3AD" text-anchor="middle">чистый поток</text><text x="432" y="214" font-size="24" fill="${GR}" text-anchor="middle" font-family="Russo">+10/мес</text>
 </svg>`;
const C = `<div class="tip C"><div class="hd"><span>РЕСУРС · ПОТОК</span><b>ТИТАН</b></div>${flow}
 <div class="ft">Бак — склад: заполнен на 9%, до верха ~272 мес. Излишки сверх 3 000 пропадают (+200 за колонию). Лишний титан — в решениях империи.</div></div>`;

const cols = [['A · СВОДКА СО ШКАЛАМИ', 'Крупно запас и доход, шкала склада, источники — строками с полосками доли; нулевые приглушены. Доход и расход разделены.', A],
  ['B · ПРОГНОЗ', 'Запас крупно, график запаса за год и пунктиром — прогноз. Источники — плитками; у пустых подсказка, как их получить.', B],
  ['C · ПОТОК', 'Схема: откуда ресурс приходит, сколько в «баке»-складе и куда уходит. Толщина линии — величина потока.', C]];
document.body.innerHTML = cols.map(([h, d, t], i) => `<div class="col" style="left:${20 + i * 640}px"><h2>${h}</h2><div class="d">${d}</div>${bar}${t}</div>`).join('');
</script></body></html>
