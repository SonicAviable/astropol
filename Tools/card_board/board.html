<!doctype html>
<html><head><meta charset="utf-8">
<!--
  Поле карточного боя на весь экран в стиле голографического тактического стола: тёмное дымчатое стекло и неоновые
  контуры (без металла). Два слоя: #screen — стекло (обычная прозрачность), #lines — только светящиеся контуры,
  в игре они рисуются шейдером Holo (перелив цвета и бегущий блик). Кольца #ring_a / #ring_b и лучи #rays —
  вращаются за портретами лидеров и вокруг кнопки хода.
  Рендер в PNG: node Tools/card_board/render.js <папка>. Геометрия совпадает с BattleScreen: центр экрана (960, 540),
  ряды карт на y = ±214, секторы через 470 px, гнездо счёта — x −845, гнездо кнопки хода — x +835.
-->
<style>
  body { margin: 0; background: transparent; }
  .a { display: inline-block; margin: 10px; vertical-align: top; }
  svg { display: block; }
</style></head>
<body>
<div class="a" id="screen"><svg width="1920" height="1080" viewBox="0 0 1920 1080"></svg></div>
<div class="a" id="lines"><svg width="1920" height="1080" viewBox="0 0 1920 1080"></svg></div>
<div class="a" id="ring_a"><svg width="512" height="512" viewBox="0 0 512 512"></svg></div>
<div class="a" id="ring_b"><svg width="512" height="512" viewBox="0 0 512 512"></svg></div>
<div class="a" id="rays"><svg width="512" height="512" viewBox="0 0 512 512"></svg></div>
<script>
const NS = 'http://www.w3.org/2000/svg';
function el(p, t, a) { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; }
// прямоугольник со срезанными углами
function cham(x, y, w, h, c) { return `M${x + c} ${y} L${x + w - c} ${y} L${x + w} ${y + c} L${x + w} ${y + h - c} L${x + w - c} ${y + h} L${x + c} ${y + h} L${x} ${y + h - c} L${x} ${y + c} Z`; }
function grad(defs, id, stops, v = true) {
  const g = el(defs, 'linearGradient', v ? { id, x1: 0, y1: 0, x2: 0, y2: 1 } : { id, x1: 0, y1: 0, x2: 1, y2: 0 });
  stops.forEach(([o, c, a]) => el(g, 'stop', { offset: o, 'stop-color': c, 'stop-opacity': a }));
  return g;
}
function glowFilters(defs) {
  const f = el(defs, 'filter', { id: 'g', x: '-30%', y: '-30%', width: '160%', height: '160%' });
  el(f, 'feGaussianBlur', { stdDeviation: 5, result: 'b' });
  const m = el(f, 'feMerge', {}); el(m, 'feMergeNode', { in: 'b' }); el(m, 'feMergeNode', { in: 'SourceGraphic' });
  const f2 = el(defs, 'filter', { id: 'gs', x: '-50%', y: '-50%', width: '200%', height: '200%' });
  el(f2, 'feGaussianBlur', { stdDeviation: 2, result: 'b' });
  const m2 = el(f2, 'feMerge', {}); el(m2, 'feMergeNode', { in: 'b' }); el(m2, 'feMergeNode', { in: 'SourceGraphic' });
  const f3 = el(defs, 'filter', { id: 'soft', x: '-50%', y: '-50%', width: '200%', height: '200%' });
  el(f3, 'feGaussianBlur', { stdDeviation: 14 });
}
const X = x => 960 + x, Y = y => 540 - y;
const RED = '#ff5a4a', TEAL = '#4df2db', ICE = '#a8e6ff', GOLD = '#ffc861';
const DW = 1440, DH = 236;   // палуба под ряд

// ======================== СТЕКЛО ========================
(function () {
  const s = document.querySelector('#screen svg');
  const defs = el(s, 'defs', {});
  glowFilters(defs);
  // полосы сверху и снизу — под руки: глубокий синий, без резкой границы
  grad(defs, 'vt', [[0, '#02050b', .9], [.13, '#02050b', .4], [.24, '#02050b', 0], [.78, '#02050b', 0], [.9, '#02050b', .5], [1, '#02050b', .92]]);
  el(s, 'rect', { x: 0, y: 0, width: 1920, height: 1080, fill: 'url(#vt)' });
  // сетка-голограмма, гаснет к краям
  const hp = el(defs, 'pattern', { id: 'hex', width: 27.7, height: 48, patternUnits: 'userSpaceOnUse' });
  el(hp, 'path', { d: 'M13.85 0 L27.7 8 L27.7 24 L13.85 32 L0 24 L0 8 Z M13.85 32 L13.85 48', fill: 'none', stroke: ICE, 'stroke-opacity': .5, 'stroke-width': 1 });
  const rg = el(defs, 'radialGradient', { id: 'fade', cx: .5, cy: .5, r: .6 });
  [[0, 1], [.6, .5], [1, 0]].forEach(([o, a]) => el(rg, 'stop', { offset: o, 'stop-color': '#fff', 'stop-opacity': a }));
  const mk = el(defs, 'mask', { id: 'mfade' }); el(mk, 'rect', { x: 0, y: 0, width: 1920, height: 1080, fill: 'url(#fade)' });

  // палубы: дымчатое стекло, у кромки к фронту — подсветка цвета стороны
  const deck = (yc, accent, front) => {
    const x0 = X(-DW / 2), y0 = Y(yc) - DH / 2;
    const d = cham(x0, y0, DW, DH, 26);
    const id = 'dk' + (front > 0 ? 'b' : 't');
    grad(defs, id, front > 0
      ? [[0, '#0a1622', .5], [.65, '#081420', .62], [1, accent, .28]]
      : [[0, accent, .28], [.35, '#081420', .62], [1, '#0a1622', .5]]);
    el(s, 'path', { d, fill: 'url(#' + id + ')' });
    el(s, 'path', { d, fill: 'url(#hex)', opacity: .05 });
    // строки развёртки
    for (let y = y0 + 4; y < y0 + DH; y += 5) el(s, 'rect', { x: x0 + 10, y, width: DW - 20, height: 1, fill: ICE, opacity: .025 });
    // мягкие «окна» под секторы — чуть светлее посередине дорожки
    for (const lx of [-470, 0, 470]) el(s, 'ellipse', { cx: X(lx), cy: Y(yc), rx: 200, ry: 92, fill: ICE, opacity: .035, filter: 'url(#soft)' });
  };
  deck(214, RED, 1);
  deck(-214, TEAL, -1);

  // общая тонкая сетка по полю (видна между палубами, тает к краям)
  el(s, 'rect', { x: 0, y: 0, width: 1920, height: 1080, fill: 'url(#hex)', opacity: .03, mask: 'url(#mfade)' });
  // полоса фронта
  grad(defs, 'fband', [[0, '#04080d', 0], [.5, '#04080d', .55], [1, '#04080d', 0]]);
  el(s, 'rect', { x: X(-800), y: Y(0) - 60, width: 1512, height: 120, fill: 'url(#fband)' });

  // гнездо счёта: стеклянная капсула
  { const cx = X(-845), cy = Y(0);
    grad(defs, 'cap', [[0, '#0c1824', .82], [.5, '#050b12', .9], [1, '#0c1824', .82]]);
    el(s, 'rect', { x: cx - 56, y: cy - 150, width: 112, height: 300, rx: 56, fill: 'url(#cap)' });
    for (const [dy, c] of [[-78, RED], [78, TEAL]]) {
      el(s, 'circle', { cx, cy: cy + dy, r: 44, fill: '#03070c', opacity: .95 });
      el(s, 'circle', { cx, cy: cy + dy, r: 40, fill: c, opacity: .12, filter: 'url(#soft)' });
    }
  }
  // гнездо кнопки хода: стеклянный диск
  { const cx = X(835), cy = Y(0);
    const sg = el(defs, 'radialGradient', { id: 'disk', cx: .5, cy: .5, r: .5 });
    [[0, '#02060a', .95], [.62, '#061019', .92], [.85, '#0b1a27', .85], [1, '#0b1a27', .0]].forEach(([o, c, a]) => el(sg, 'stop', { offset: o, 'stop-color': c, 'stop-opacity': a }));
    el(s, 'circle', { cx, cy, r: 140, fill: 'url(#disk)' });
  }
  // угловые плиты: стекло, растворяется к середине экрана
  grad(defs, 'pl', [[0, '#071321', .88], [.75, '#071321', .6], [1, '#071321', 0]], false);
  grad(defs, 'pr', [[0, '#071321', 0], [.25, '#071321', .6], [1, '#071321', .88]], false);
  el(s, 'path', { d: 'M0 0 L600 0 L556 92 L0 92 Z', fill: 'url(#pl)' });
  el(s, 'path', { d: 'M0 1080 L600 1080 L556 988 L0 988 Z', fill: 'url(#pl)' });
  el(s, 'path', { d: 'M1920 0 L1630 0 L1672 74 L1920 74 Z', fill: 'url(#pr)' });
})();

// ======================== НЕОНОВЫЕ КОНТУРЫ ========================
// Только свет: в игре слой складывается со сценой и переливается (шейдер Holo).
(function () {
  const s = document.querySelector('#lines svg');
  const defs = el(s, 'defs', {});
  glowFilters(defs);
  const line = (d, c, w, o = 1, f = 'gs') => el(s, 'path', { d, fill: 'none', stroke: c, 'stroke-width': w, 'stroke-opacity': o, filter: 'url(#' + f + ')', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });

  const deck = (yc, accent, front) => {
    const x0 = X(-DW / 2), y0 = Y(yc) - DH / 2, x1 = x0 + DW, y1 = y0 + DH, c = 26;
    line(cham(x0, y0, DW, DH, c), ICE, 1.2, .35);
    // уголки-скобы
    const L = 70;
    for (const [sx, sy] of [[0, 0], [1, 0], [0, 1], [1, 1]]) {
      const ox = sx ? x1 : x0, oy = sy ? y1 : y0, dx = sx ? -1 : 1, dy = sy ? -1 : 1;
      line(`M${ox + dx * (c + L)} ${oy} L${ox + dx * c} ${oy} L${ox} ${oy + dy * c} L${ox} ${oy + dy * (c + L * .6)}`, ICE, 2.6, .95);
    }
    // кромка к фронту — цвет стороны
    const fy = front > 0 ? y1 : y0;
    line(`M${x0 + 120} ${fy} L${x1 - 120} ${fy}`, accent, 3, 1, 'g');
    line(`M${x0 + 150} ${fy} L${x1 - 150} ${fy}`, '#ffffff', 1, .85);
    // шевроны к центру по краям кромки
    for (let i = 0; i < 3; i++) for (const k of [-1, 1]) {
      const cx = k < 0 ? x0 + 96 - i * 13 : x1 - 96 + i * 13, dir = k;
      line(`M${cx} ${fy - 7} L${cx + dir * 7} ${fy} L${cx} ${fy + 7}`, accent, 2.2, .9 - i * .25);
    }
    // швы между секторами: пунктир с ромбом
    for (const lx of [-235, 235]) {
      for (let y = y0 + 18; y < y1 - 18; y += 16) line(`M${X(lx)} ${y} L${X(lx)} ${y + 7}`, ICE, 1.4, .4);
      const my = (y0 + y1) / 2;
      line(`M${X(lx)} ${my - 8} L${X(lx) + 6} ${my} L${X(lx)} ${my + 8} L${X(lx) - 6} ${my} Z`, ICE, 1.4, .7);
    }
  };
  deck(214, RED, 1);
  deck(-214, TEAL, -1);

  // линия фронта: энергетическая нить с узлами
  const fy = Y(0), lx0 = X(-790), lx1 = X(700);
  grad(defs, 'fl', [[0, TEAL, 0], [.08, TEAL, .9], [.5, ICE, 1], [.92, TEAL, .9], [1, TEAL, 0]], false);
  el(s, 'rect', { x: lx0, y: fy - 2, width: lx1 - lx0, height: 4, fill: 'url(#fl)', filter: 'url(#g)' });
  el(s, 'rect', { x: lx0 + 30, y: fy - .6, width: lx1 - lx0 - 60, height: 1.2, fill: '#ffffff', opacity: .9 });
  for (const x of [-235, 235]) {
    line(`M${X(x)} ${fy - 13} L${X(x) + 13} ${fy} L${X(x)} ${fy + 13} L${X(x) - 13} ${fy} Z`, TEAL, 2, 1);
    el(s, 'circle', { cx: X(x), cy: fy, r: 3.5, fill: '#ffffff', filter: 'url(#gs)' });
  }

  // гнездо счёта
  { const cx = X(-845), cy = Y(0);
    el(s, 'rect', { x: cx - 56, y: cy - 150, width: 112, height: 300, rx: 56, fill: 'none', stroke: ICE, 'stroke-width': 1.6, 'stroke-opacity': .6, filter: 'url(#gs)' });
    for (const [dy, c] of [[-78, RED], [78, TEAL]]) {
      el(s, 'circle', { cx, cy: cy + dy, r: 44, fill: 'none', stroke: c, 'stroke-width': 2.6, filter: 'url(#g)' });
    }
    el(s, 'rect', { x: cx - 30, y: cy - 3, width: 60, height: 6, rx: 3, fill: TEAL, filter: 'url(#gs)', opacity: .85 });
  }

  // гнездо кнопки хода: кольца паза и риски
  { const cx = X(835), cy = Y(0);
    el(s, 'circle', { cx, cy, r: 132, fill: 'none', stroke: ICE, 'stroke-width': 1.6, 'stroke-opacity': .7, filter: 'url(#gs)' });
    el(s, 'circle', { cx, cy, r: 116, fill: 'none', stroke: ICE, 'stroke-width': 1, 'stroke-opacity': .35 });
    el(s, 'circle', { cx, cy, r: 92, fill: 'none', stroke: ICE, 'stroke-width': 1, 'stroke-opacity': .35 });
    el(s, 'circle', { cx, cy, r: 84, fill: 'none', stroke: TEAL, 'stroke-width': 2.4, filter: 'url(#g)' });
    for (let a = 0; a < 360; a += 6) {
      const t = a * Math.PI / 180, big = a % 30 === 0, r0 = big ? 122 : 125, r1 = 129;
      el(s, 'line', { x1: cx + Math.cos(t) * r0, y1: cy + Math.sin(t) * r0, x2: cx + Math.cos(t) * r1, y2: cy + Math.sin(t) * r1, stroke: ICE, 'stroke-width': big ? 2 : 1, 'stroke-opacity': big ? .8 : .4 });
    }
  }

  // угловые плиты: светящаяся кромка по скосу
  line('M0 92 L556 92 L600 0', ICE, 1.6, .7);
  line('M0 988 L556 988 L600 1080', ICE, 1.6, .7);
  line('M1920 74 L1672 74 L1630 0', ICE, 1.6, .7);
  line('M20 92 L200 92', RED, 3, 1, 'g');
  line('M20 988 L200 988', TEAL, 3, 1, 'g');
  for (const [x, y, c] of [[556, 92, RED], [556, 988, TEAL], [1672, 74, GOLD]]) el(s, 'circle', { cx: x, cy: y, r: 4, fill: c, filter: 'url(#g)' });
})();

// ======================== КОЛЬЦА И ЛУЧИ (вращаются в игре) ========================
(function () {
  const c = 256;
  const arc = (p, r, a0, a1, w, o) => {
    const t0 = a0 * Math.PI / 180, t1 = a1 * Math.PI / 180;
    el(p, 'path', { d: `M${c + Math.cos(t0) * r} ${c + Math.sin(t0) * r} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${c + Math.cos(t1) * r} ${c + Math.sin(t1) * r}`, fill: 'none', stroke: '#fff', 'stroke-width': w, 'stroke-opacity': o, 'stroke-linecap': 'round', filter: 'url(#gs)' });
  };
  // кольцо А: риски и разомкнутые дуги
  const a = document.querySelector('#ring_a svg'); glowFilters(el(a, 'defs', {}));
  for (let d = 0; d < 360; d += 4) {
    const t = d * Math.PI / 180, big = d % 40 === 0, r0 = big ? 212 : 220, r1 = 232;
    el(a, 'line', { x1: c + Math.cos(t) * r0, y1: c + Math.sin(t) * r0, x2: c + Math.cos(t) * r1, y2: c + Math.sin(t) * r1, stroke: '#fff', 'stroke-width': big ? 4 : 2, 'stroke-opacity': big ? 1 : .5, filter: 'url(#gs)' });
  }
  for (let k = 0; k < 3; k++) arc(a, 196, k * 120 + 10, k * 120 + 100, 5, 1);
  arc(a, 244, 200, 330, 2, .7);
  arc(a, 244, 20, 150, 2, .7);

  // кольцо Б: сегменты и точки
  const b = document.querySelector('#ring_b svg'); glowFilters(el(b, 'defs', {}));
  for (let k = 0; k < 12; k++) arc(b, 210, k * 30 + 4, k * 30 + 22, 10, k % 3 === 0 ? 1 : .55);
  for (let k = 0; k < 24; k++) { const t = (k * 15 + 7) * Math.PI / 180; el(b, 'circle', { cx: c + Math.cos(t) * 236, cy: c + Math.sin(t) * 236, r: 3, fill: '#fff', opacity: .8, filter: 'url(#gs)' }); }
  arc(b, 180, 0, 359.9, 1.5, .45);

  // лучи: мягкий нимб с расходящимися лучами (за портретом лидера)
  const r = document.querySelector('#rays svg'); const defs2 = el(r, 'defs', {}); glowFilters(defs2);
  const rg = el(defs2, 'radialGradient', { id: 'rf', cx: .5, cy: .5, r: .5 });
  [[0, 1], [.25, .8], [.7, .15], [1, 0]].forEach(([o, op]) => el(rg, 'stop', { offset: o, 'stop-color': '#fff', 'stop-opacity': op }));
  const mk = el(defs2, 'mask', { id: 'mr' }); el(mk, 'rect', { x: 0, y: 0, width: 512, height: 512, fill: 'url(#rf)' });
  const g = el(r, 'g', { mask: 'url(#mr)' });
  for (let k = 0; k < 18; k++) {
    const t = k * 20 + (k % 2 ? 6 : 0), w = k % 3 === 0 ? 7 : 3.5, t0 = (t - w) * Math.PI / 180, t1 = (t + w) * Math.PI / 180;
    el(g, 'path', { d: `M${c} ${c} L${c + Math.cos(t0) * 256} ${c + Math.sin(t0) * 256} L${c + Math.cos(t1) * 256} ${c + Math.sin(t1) * 256} Z`, fill: '#fff', opacity: k % 3 === 0 ? .55 : .3, filter: 'url(#gs)' });
  }
})();
</script>
</body></html>
