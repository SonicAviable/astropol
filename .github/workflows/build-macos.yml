# Сборка Astropolity для macOS в облаке GitHub — без Mac и без Unity на своём компьютере.
#
# Один раз: Settings → Secrets and variables → Actions → New repository secret:
#   UNITY_EMAIL    — почта аккаунта Unity
#   UNITY_PASSWORD — пароль аккаунта Unity
#   UNITY_LICENSE  — содержимое файла лицензии Unity_lic.ulf
#                    (Windows: C:\ProgramData\Unity\Unity_lic.ulf, Mac: /Library/Application Support/Unity/Unity_lic.ulf)
#
# Запуск: вкладка Actions → «Build macOS» → Run workflow.
# Результат: внизу страницы запуска, в разделе Artifacts — архив с Astropolity-macOS.tar.gz.
name: Build macOS

on:
  workflow_dispatch:
    inputs:
      universal:
        description: "Универсальная сборка (Intel + Apple Silicon). Выключено — только Intel"
        type: boolean
        default: false

jobs:
  macos:
    name: Astropolity для macOS
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Освободить место на диске
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Код проекта
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Кэш Library (ускоряет повторные сборки)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneOSX-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-StandaloneOSX-

      - name: Сборка Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneOSX
          buildMethod: MacBuild.BuildFromCommandLine
          customParameters: ${{ inputs.universal && '-macUniversal' || '' }}
          versioning: None

      - name: Выложить архив
        uses: actions/upload-artifact@v4
        with:
          name: Astropolity-macOS
          path: Builds/macOS/Astropolity-macOS.tar.gz
          compression-level: 0
          if-no-files-found: error
